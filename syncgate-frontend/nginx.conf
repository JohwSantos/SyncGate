server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Essencial para o React Router funcionar: quando o navegador
    # pede uma rota como /usuarios diretamente (F5 na página, ou
    # um link direto), o Nginx não tem esse arquivo físico — então
    # devolve o index.html, e o React Router assume a partir daí.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html nunca fica em cache: depois de um novo build, o
    # navegador sempre descobre os arquivos JS/CSS novos. Esses têm
    # um código no nome (ex.: index-DI568F0q.js) que muda a cada
    # build, então podem ficar em cache por bastante tempo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
